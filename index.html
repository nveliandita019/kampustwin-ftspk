<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KampusTwin FTSPK</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">KampusTwin FTSPK</span>
    <small class="text-light">Digital twin Fakultas Teknik Sipil, Perencanaan, dan Kebumian ITS</small>
  </nav>

  <div id="panel" class="p-3">
    <h6>Tingkat detail (LOD)</h6>
    <div class="btn-group mb-3" role="group">
      <button class="btn btn-sm btn-outline-primary active" data-lod="1">LOD 1</button>
      <button class="btn btn-sm btn-outline-primary" data-lod="2">LOD 2</button>
      <button class="btn btn-sm btn-outline-primary" data-lod="3">LOD 3</button>
    </div>
    <h6>Layer</h6>
    <div class="form-check"><input class="form-check-input" type="checkbox" id="lyr-bangunan" checked><label class="form-check-label" for="lyr-bangunan">Gedung</label></div>
    <p class="small text-muted mt-3 mb-0">Simulasi (kendaraan, banjir, cuaca) akan ditambahkan.</p>
  </div>

  <div id="map"></div>

  <div class="modal fade" id="modalGedung" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="mg-judul"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="mg-isi"></div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
